services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      API_URL: http://server:4000
    depends_on:
      server:
        condition: service_healthy